name: Matrix CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    # Allow the experimental Node 24 job to fail without failing the workflow.
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      # Don't stop the matrix after the first failure.
      # We want to see compatibility results for every OS and Node version.
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]

        include:
          - os: ubuntu-latest
            node: 24
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Print environment info for debugging
        run: |
          node --version
          npm --version

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - run: npm test
